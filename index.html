<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zanish Rohail | Creative Data Technologist • 2026</title>
  
  <!-- Precompute specialised typography (Neue Haas Grotesk is premium; this is the free close equivalent) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- The Special WebGL Canvas Layer (Draws behind everything) -->
  <canvas class="webgl-canvas"></canvas>

  <!-- The Main Standard Content Layer (Handled by Lenis for smooth scroll) -->
  <main class="content-wrapper" id="smooth-wrapper">
    
    <!-- Navigation (`00:00`) -->
    <nav class="navbar">
      <div class="logo">ZR • 2026</div>
      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#projects">Work</a>
        <a href="#contact">Lets Talk</a>
      </div>
    </nav>

    <!-- 1. Echo Minimal Hero (`00:00`) -->
    <header class="echo-hero">
      <div class="hero-content">
        <div class="hero-title">
          EXPLORE MY <br> 
          <span class="indented">PORTFOLIO.</span>
        </div>
        
        <div class="hero-status">
          (AVAILABLE • 2026) <br>
          Based in Rawalpindi.
        </div>
      </div>
    </header>

    <!-- 2. The Fluid Shader About Me Section (`00:03`) -->
    <!-- The WebGL script will target this container, center your `about-image.jpg`, 
         and apply the distortion mechanics. -->
    <section class="shader-section" id="about">
      <div class="shader-text-overlay">
        <h2>ABOUT <br> ME.</h2>
      </div>
      <!-- WebGL Canvas will dynamically center itself here via JavaScript -->
    </section>

    <!-- 3. Parallax Scrolling Layered Text Section (`00:06`) -->
    <section class="experience-section">
      <div class="parallax-container">
        <h1 class="parallax-text back-text">CREATIVE DATA TECHNOLOGIST</h1>
        <h1 class="parallax-text front-text">CREATIVE DATA TECHNOLOGIST</h1>
      </div>
    </section>

    <!-- ...Placeholder for further sections (Projects Carousel, Lets Talk)... -->
    <div style="height: 100vh;"></div>

  </main>

  <!-- --- specialized ANIMATION STACK (Must be at the end) --- -->
  
  <!-- 1. GSAP: The standard core motion engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- GSAP Extension: Scrolls animations smoothly based on scroll position -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  
  <!-- 2. Three.js: The 3D and Shader Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- 3. Lenis: The smooth scrolling engine (From Studio Freight) -->
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.36/dist/lenis.min.js"></script>
  
  <!-- 4. These are the custom scripts we build below -->
  <script src="shader-engine.js"></script> <!-- Handles the complex shader logic -->
  <script src="script.js"></script>        <!-- Handles general scrolling/parallax -->
</body>
</html>
